modelRoles:
  default: aiinput/gpt-5.6-sol:max
  research: tokenking-grok/grok-4.6:high

retry:
  # The extension wraps every model transport and owns managed retries.
  maxRetries: 0
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    aiinput/*:
      - tokenking/gpt-5.6-sol:max
    kimi-code/*:
      - aiinput/gpt-5.6-sol:max
    tokenking-grok/*:
      - aiinput/gpt-5.6-sol:max
