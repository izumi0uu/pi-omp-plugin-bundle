modelRoles:
  default: aiinput/gpt-5.6-sol:max
  research: tokenking-grok/grok-4.6:high

retry:
  # The extension wraps every model transport and owns managed retries.
  maxRetries: 0
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    aiinput/*:
      - tokenking/gpt-5.6-sol:max
    kimi-code/*:
      - aiinput/gpt-5.6-sol:max
    tokenking-grok/*:
      - aiinput/gpt-5.6-sol:max
    # AgentRouter accounts are independent credentials. Quota exhaustion on
    # one account is forwarded to OMP so it can advance this ordered chain.
    agentrouter/*:
      - agentrouter-2/*
      - agentrouter-3/*
    agentrouter-2/*:
      - agentrouter-3/*
    justworker/*:
      - justworker-2/*
      - justworker-3/*
    justworker-2/*:
      - justworker-3/*
